[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capillary-flow-porometry-analyzer"
dynamic = ["version"]
description = "Analyze PMI CapWin capillary flow porometry (.CFT) files: bubble point, mean flow pore, pore size distribution, QC, overlays."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Brandon T. McReynolds" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PyQt6>=6.5",
    "python-pptx>=0.6.21",
    "scipy>=1.10",  # group statistics (t-test, ANOVA, Tukey HSD)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.17,<0.18"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
validate = ["xlrd>=2"]  # tools/caprep_check.py reads CapRep's .xls exports

[project.scripts]
porometry-cli = "porometry.cli:main"

[project.gui-scripts]
porometry = "porometry.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "porometry.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"porometry.gui" = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",  # long lines: wrap them when touching that code
    "E702",  # `a = 1; b = 2` on one line is the existing style in tools/ and the notebooks
    "B905",  # zip() without strict=: lengths are checked where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]  # asserts; tests run git and the app itself
"src/porometry/updater.py" = ["S603", "S607"]  # runs git and pip with fixed arguments
"src/porometry/shortcuts.py" = ["S603", "S607"]  # runs powershell with fixed arguments
"src/porometry/gui/models.py" = ["B008"]  # QModelIndex() default argument is the Qt idiom
"src/porometry/settings_location.py" = ["I001", "S110"]  # shared byte-identical copy with the other UAkron apps
